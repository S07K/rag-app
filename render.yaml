# Render blueprint. Postgres lives on Neon (free tier, pgvector), so this
# declares only the web service.
services:
  - type: web
    name: rag-chat
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: EMBEDDING_PROVIDER
        value: gemini
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      # Free plan has no background workers, so ingestion runs in this process.
      # On a paid plan, drop this and add a `type: worker` service running
      # `bun worker.entry.ts` against the same DATABASE_URL.
      - key: RUN_WORKER_INLINE
        value: "true"
      # Ingestion is triggered in-process on upload (wake()), so idle polling is
      # only a safety net for jobs left behind by a crash.
      #
      # Neon bills ~5 minutes of compute per wake-up regardless of query length,
      # so the interval sets the floor on monthly usage: every 10 min would be
      # ~365 compute-hours against a 100-hour quota; hourly is ~61.
      - key: WORKER_POLL_MS
        value: "3600000"
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard — never in this file.
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
