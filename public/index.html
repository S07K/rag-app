<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG Chat</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f7f7f8; --border: #e3e3e6; --text: #18181b;
    --muted: #71717a; --accent: #2563eb; --accent-fg: #ffffff;
    --user-bg: #2563eb; --user-fg: #ffffff; --bot-bg: #f4f4f5;
    --ok: #16a34a; --warn: #ca8a04; --err: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #18181b; --panel: #1f1f23; --border: #2e2e33; --text: #f4f4f5;
      --muted: #a1a1aa; --accent: #3b82f6; --bot-bg: #27272a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: flex;
    font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
  }
  button { font: inherit; cursor: pointer; }

  /* ---- sidebar ---- */
  aside {
    width: 260px; flex-shrink: 0; border-right: 1px solid var(--border);
    background: var(--panel); display: flex; flex-direction: column;
  }
  aside header { padding: 14px; border-bottom: 1px solid var(--border); }
  aside h1 { margin: 0 0 10px; font-size: 15px; letter-spacing: -0.01em; }
  #newChat {
    width: 100%; padding: 8px; border: 0; border-radius: 7px;
    background: var(--accent); color: var(--accent-fg); font-weight: 500;
  }
  #chatList { flex: 1; overflow-y: auto; padding: 8px; }
  .chatItem {
    padding: 8px 10px; border-radius: 7px; cursor: pointer; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--muted);
  }
  .chatItem:hover { background: var(--border); }
  .chatItem.active { background: var(--border); color: var(--text); font-weight: 500; }
  aside footer { padding: 10px 14px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }

  /* ---- main ---- */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #docBar {
    padding: 8px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap; min-height: 45px;
  }
  #docBar label {
    padding: 5px 11px; border: 1px solid var(--border); border-radius: 7px;
    font-size: 13px; cursor: pointer; background: var(--bg);
  }
  #docBar label:hover { border-color: var(--accent); }
  #docs { display: flex; gap: 6px; flex-wrap: wrap; }
  .doc {
    font-size: 12px; padding: 3px 9px; border-radius: 20px;
    background: var(--panel); border: 1px solid var(--border); color: var(--muted);
  }
  .doc.ready::before  { content: "● "; color: var(--ok); }
  .doc.failed::before { content: "● "; color: var(--err); }
  .doc.processing::before, .doc.pending::before { content: "◌ "; color: var(--warn); }

  #messages { flex: 1; overflow-y: auto; padding: 20px 16px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  .msg { margin-bottom: 18px; display: flex; flex-direction: column; align-items: flex-start; }
  .msg.user { align-items: flex-end; }
  .bubble {
    padding: 10px 14px; border-radius: 14px; max-width: 82%;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .msg.user .bubble { background: var(--user-bg); color: var(--user-fg); border-bottom-right-radius: 4px; }
  .msg.assistant .bubble { background: var(--bot-bg); border-bottom-left-radius: 4px; }
  .meta { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .sources { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
  .src {
    font-size: 11px; padding: 2px 7px; border-radius: 5px;
    border: 1px solid var(--border); color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .err { color: var(--err); }
  .empty { color: var(--muted); text-align: center; margin-top: 60px; font-size: 14px; }
  .cursor::after {
    content: "▌"; animation: blink 1s steps(2) infinite; color: var(--muted);
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---- composer ---- */
  form { border-top: 1px solid var(--border); padding: 12px 16px; }
  .composer { max-width: 720px; margin: 0 auto; display: flex; gap: 8px; }
  textarea {
    flex: 1; resize: none; padding: 10px 12px; border-radius: 9px; font: inherit;
    border: 1px solid var(--border); background: var(--bg); color: var(--text);
    max-height: 160px;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #send, #stop {
    padding: 0 16px; border: 0; border-radius: 9px;
    background: var(--accent); color: var(--accent-fg); font-weight: 500;
  }
  #stop { background: var(--err); }
  button:disabled { opacity: .45; cursor: not-allowed; }
</style>
</head>
<body>

<aside>
  <header>
    <h1>RAG Chat</h1>
    <button id="newChat">New chat</button>
  </header>
  <div id="chatList"></div>
  <footer id="status">ready</footer>
</aside>

<main>
  <div id="docBar">
    <label>
      <input type="file" id="file" accept=".txt,.md" hidden> Upload .txt / .md
    </label>
    <div id="docs"></div>
  </div>

  <div id="messages"><div class="wrap" id="thread"></div></div>

  <form id="composer">
    <div class="composer">
      <textarea id="input" rows="1" placeholder="Ask about your documents…"></textarea>
      <button id="send" type="submit">Send</button>
      <button id="stop" type="button" hidden>Stop</button>
    </div>
  </form>
</main>

<script>
const $ = (id) => document.getElementById(id)
let chatId = null
let controller = null

const setStatus = (t) => { $("status").textContent = t }

async function api(path, options) {
  const res = await fetch(path, options)
  if (!res.ok) {
    const body = await res.json().catch(() => ({}))
    throw new Error(body.error || `${res.status} ${res.statusText}`)
  }
  return res.status === 204 ? null : res.json()
}

/* ---------------- chats ---------------- */
async function loadChats() {
  const chats = await api("/chats")
  $("chatList").innerHTML = ""
  for (const c of chats) {
    const el = document.createElement("div")
    el.className = "chatItem" + (c.id === chatId ? " active" : "")
    el.textContent = c.title
    el.onclick = () => selectChat(c.id)
    $("chatList").append(el)
  }
  return chats
}

async function newChat() {
  const title = "Chat " + new Date().toLocaleTimeString()
  const chat = await api("/chats", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ title }),
  })
  await selectChat(chat.id)
}

async function selectChat(id) {
  chatId = id
  await loadChats()
  await Promise.all([loadMessages(), loadDocs()])
}

/* ---------------- documents ---------------- */
async function loadDocs() {
  if (!chatId) return
  const docs = await api(`/chats/${chatId}/uploads`)
  $("docs").innerHTML = ""
  for (const d of docs) {
    const el = document.createElement("span")
    el.className = "doc " + d.status
    el.textContent = d.filename
    $("docs").append(el)
  }
}

$("file").onchange = async (e) => {
  const file = e.target.files[0]
  if (!file) return
  if (!chatId) await newChat()

  setStatus(`uploading ${file.name}…`)
  const form = new FormData()
  form.append("file", file)

  try {
    await api(`/chats/${chatId}/uploads`, { method: "POST", body: form })
    setStatus("indexed " + file.name)
  } catch (err) {
    setStatus("upload failed: " + err.message)
  }
  e.target.value = ""
  loadDocs()
}

/* ---------------- messages ---------------- */
function addMessage(role, text = "") {
  $("thread").querySelector(".empty")?.remove()

  const msg = document.createElement("div")
  msg.className = "msg " + role
  const bubble = document.createElement("div")
  bubble.className = "bubble"
  bubble.textContent = text
  msg.append(bubble)
  $("thread").append(msg)
  scroll()
  return bubble
}

const scroll = () => { $("messages").scrollTop = $("messages").scrollHeight }

async function loadMessages() {
  $("thread").innerHTML = ""
  if (!chatId) {
    $("thread").innerHTML = '<div class="empty">Create a chat, upload a document, ask a question.</div>'
    return
  }
  const messages = await api(`/chats/${chatId}/messages`)
  if (!messages.length) {
    $("thread").innerHTML = '<div class="empty">Upload a .txt or .md file, then ask about it.</div>'
    return
  }
  for (const m of messages) addMessage(m.role, m.content)
}

/* SSE over POST: EventSource only supports GET, so parse the stream by hand. */
async function* readEvents(response, signal) {
  const reader = response.body.pipeThrough(new TextDecoderStream()).getReader()
  let buffer = ""

  try {
    while (true) {
      const { done, value } = await reader.read()
      if (done) break

      buffer += value
      const frames = buffer.split("\n\n")
      buffer = frames.pop() ?? ""          // last frame may be incomplete

      for (const frame of frames) {
        let event = "message", data = ""
        for (const line of frame.split("\n")) {
          if (line.startsWith("event:")) event = line.slice(6).trim()
          else if (line.startsWith("data:")) data += line.slice(5).trim()
        }
        if (data) yield { event, data: JSON.parse(data) }
      }
    }
  } finally {
    await reader.cancel().catch(() => {})
  }
}

async function send(content) {
  if (!chatId) await newChat()

  addMessage("user", content)
  const bubble = addMessage("assistant", "")
  bubble.classList.add("cursor")

  controller = new AbortController()
  $("send").hidden = true
  $("stop").hidden = false

  let answer = ""

  try {
    const res = await fetch(`/chats/${chatId}/messages`, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ content }),
      signal: controller.signal,
    })

    if (!res.ok) {
      const body = await res.json().catch(() => ({}))
      throw new Error(body.error || `${res.status}`)
    }

    for await (const { event, data } of readEvents(res)) {
      if (event === "status") setStatus(data)

      if (event === "sources") {
        if (data.length) {
          const box = document.createElement("div")
          box.className = "sources"
          data.forEach((s, i) =>
            box.insertAdjacentHTML("beforeend",
              `<span class="src">[${i + 1}] chunk ${s.chunkIndex} · ${s.distance.toFixed(3)}</span>`))
          bubble.parentElement.append(box)
        }
      }

      if (event === "token") { answer += data; bubble.textContent = answer; scroll() }

      if (event === "error") {
        bubble.classList.add("err")
        bubble.textContent = answer + (answer ? "\n\n" : "") + "⚠ " + data.message
      }

      if (event === "done") setStatus("ready")
    }
  } catch (err) {
    if (err.name === "AbortError") setStatus("stopped")
    else { bubble.classList.add("err"); bubble.textContent = "⚠ " + err.message; setStatus("error") }
  } finally {
    bubble.classList.remove("cursor")
    $("send").hidden = false
    $("stop").hidden = true
    controller = null
    loadChats()
  }
}

/* ---------------- wiring ---------------- */
$("newChat").onclick = newChat
$("stop").onclick = () => controller?.abort()

$("input").addEventListener("input", (e) => {
  e.target.style.height = "auto"
  e.target.style.height = e.target.scrollHeight + "px"
})

$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("composer").requestSubmit() }
})

$("composer").onsubmit = (e) => {
  e.preventDefault()
  const content = $("input").value.trim()
  if (!content || controller) return
  $("input").value = ""
  $("input").style.height = "auto"
  send(content)
}

/* boot */
;(async () => {
  const chats = await loadChats()
  if (chats.length) await selectChat(chats[0].id)
  else await loadMessages()
})()
</script>
</body>
</html>
